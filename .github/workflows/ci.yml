name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo config --type public
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run assert:worklets
      - run: npm run assert:solvability
      - run: npm run assert:skia
      - run: npm run assert:privacy-manifest
      - run: npm run assert:eas-profiles
      - name: Coverage floor
        run: npx vitest run --coverage --coverage.thresholds.lines=40
      - name: Expo web export
        run: npx expo export --platform web --output-dir /tmp/expo-export-ci
        timeout-minutes: 15
